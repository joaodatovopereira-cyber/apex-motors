<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo de Motos | Apex Motors</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <div class="header-container">
      <a href="index.html" class="logo">APEX <span>MOTORS</span></a>
      <button class="menu-toggle" id="menu-toggle">
        <span></span><span></span><span></span>
      </button>
      <nav>
        <ul class="nav-list" id="nav-list">
          <li><a href="index.html" class="nav-link">Início</a></li>
          <li><a href="motos.html" class="nav-link active">Motos</a></li>
          <li><a href="sobre.html" class="nav-link">Sobre nós</a></li>
          <li><a href="contato.html" class="nav-link">Contato</a></li>
          <li><a href="motos.html" class="btn btn-primary">Comprar uma moto</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container">
    <h1 class="section-title">Nosso Catálogo</h1>

    <div class="filter-bar">
      <div class="form-group">
        <label for="search-input">Buscar</label>
        <input type="text" id="search-input" class="form-control" placeholder="Modelo ou marca...">
      </div>
      <div class="form-group">
        <label for="filter-brand">Marca</label>
        <select id="filter-brand" class="form-control">
          <option value="">Todas</option>
          <option value="Yamaha">Yamaha</option>
          <option value="BMW">BMW</option>
          <option value="Honda">Honda</option>
          <option value="Kawasaki">Kawasaki</option>
          <option value="Harley-Davidson">Harley-Davidson</option>
          <option value="Ducati">Ducati</option>
        </select>
      </div>
      <div class="form-group">
        <label for="filter-category">Categoria</label>
        <select id="filter-category" class="form-control">
          <option value="">Todas</option>
          <option value="Street">Street</option>
          <option value="Naked">Naked</option>
          <option value="Esportiva">Esportiva</option>
          <option value="Trail">Trail</option>
          <option value="Custom">Custom</option>
          <option value="Scooter">Scooter</option>
        </select>
      </div>
    </div>

    <div class="grid" id="catalog-grid"></div>
  </main>

  <footer class="footer">
    <div class="footer-bottom">
      <p>&copy; 2026 Apex Motors. Todos os direitos reservados.</p>
    </div>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
